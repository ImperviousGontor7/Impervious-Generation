
name: Deploy Impervious Generation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/impervious_build

      - name: Build frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -s dist/client/index.html
          test -s dist/client/404.html
          test -d dist/client/assets

          echo "Production build berhasil."
          echo "index.html ditemukan."
          echo "404.html ditemukan."
          echo "Assets ditemukan."

          echo "Generated assets:"
          grep -Eo '(src|href)="[^"]+"' dist/client/index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
